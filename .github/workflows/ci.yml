name: ci

on:
  push:
    branches: [main, 1.7.x]
  pull_request:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  dart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
      - run: flutter pub get
      - run: flutter pub get
        working-directory: example
      - run: flutter analyze
      - name: Generated code is up to date
        # A schema edited without regenerating leaves the three sides
        # speaking different shapes, and nothing else in CI catches it: the
        # Dart tests run against the stale generated code and pass.
        #
        # Scoped to the schema and its three generated files, not the whole
        # working tree: this step runs after two `flutter pub get`, and
        # `example/pubspec.lock` is tracked. Anything that rewrites it on the
        # runner would otherwise trip this check and send whoever's debugging
        # looking for a Pigeon problem that isn't there.
        run: |
          dart run pigeon --input pigeons/khipu_api.dart
          if ! git diff --exit-code --stat -- \
            pigeons/khipu_api.dart \
            lib/src/messages.g.dart \
            android/src/main/kotlin/com/khipu/flutter_khipu/Messages.g.kt \
            ios/flutter_khipu/Sources/flutter_khipu/Messages.g.swift; then
            echo "::error::generated code does not match pigeons/khipu_api.dart; run 'dart run pigeon --input pigeons/khipu_api.dart' and commit"
            exit 1
          fi
      - run: flutter test
      - name: Publish dry run
        run: dart pub publish --dry-run
      - name: Tarball stays small
        # 1.7.0 shipped 87 MB of Dart compiler caches because a .pubignore
        # stopped the root .gitignore's build/ pattern from applying. It is
        # 98 KB today; 5 MB is room to grow and still catches that class of bug.
        run: |
          size=$(dart pub publish --dry-run 2>&1 \
            | grep -oE 'Total compressed archive size: [0-9.]+ [KMG]B' \
            | grep -oE '[0-9.]+ [KMG]B') || true
          echo "tarball: ${size:-<could not measure>}"
          if [ -z "$size" ]; then
            echo "::error::could not parse the tarball size from dart pub publish output"
            exit 1
          fi
          n=${size%% *}
          unit=${size##* }
          case "$unit" in
            KB) mb=$(awk -v n="$n" 'BEGIN{printf "%.6f", n/1024}') ;;
            MB) mb="$n" ;;
            GB) mb=$(awk -v n="$n" 'BEGIN{printf "%.6f", n*1024}') ;;
            *)  echo "::error::unrecognised size unit in '$size'"; exit 1 ;;
          esac
          if awk -v m="$mb" 'BEGIN{exit !(m>5)}'; then
            echo "::error::tarball is $size, over the 5 MB cap"
            exit 1
          fi

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
      - run: flutter pub get
        working-directory: example
      - run: flutter build apk --debug
        working-directory: example
      - name: Kotlin unit tests
        run: ./gradlew :flutter_khipu:test
        working-directory: example/android

  ios:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
      - run: flutter pub get
        working-directory: example
      - name: Build with Swift Package Manager
        run: |
          flutter config --enable-swift-package-manager
          flutter build ios --no-codesign --debug
        working-directory: example
      - name: Build with CocoaPods
        run: |
          flutter config --no-enable-swift-package-manager
          flutter clean && flutter build ios --no-codesign --debug
        working-directory: example
