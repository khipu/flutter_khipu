name: ci-1.7.x-weekly

# GitHub only runs scheduled workflows on the default branch, so ci.yml's
# nightly run never reaches the 1.7.x maintenance line, and a `schedule` in
# 1.7.x's own ci.yml would never fire. This dispatches 1.7.x's ci.yml against
# that branch once a week instead. Whatever moves underneath it (runner
# images, Flutter, where the native SDKs are hosted) then surfaces before the
# next fix has to ship, not while it's trying to.
#
# A dispatch made with GITHUB_TOKEN does start a run: workflow_dispatch is one
# of the two events exempt from the rule that token-triggered events don't.
# It needs 1.7.x's ci.yml to declare `workflow_dispatch`.

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run ci.yml on 1.7.x
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref 1.7.x
